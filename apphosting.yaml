# Public Firebase web config is required in the Next.js build and server runtime.
# Secrets (PAYSTACK_SECRET_KEY) come from Cloud Secret Manager; see the end of this file.
runConfig:
  minInstances: 0
  maxInstances: 2
  memoryMiB: 1024
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyC6Ah5obKzVFGwqd3bmZ8KrN3WDUESJYpM"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "bookishdelightghh.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "bookishdelightghh"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "bookishdelightghh.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "231899789603"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:231899789603:web:5ccf485b4105b3cff67496"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SITE_URL
    value: "https://bookishdelightgh.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: FIREBASE_PROJECT_ID
    value: "bookishdelightghh"
    availability:
      - BUILD
      - RUNTIME
  - variable: BOOKISH_ADMIN_STORE
    value: "firestore"
    availability:
      - BUILD
      - RUNTIME
  # Paystack secret key, stored in Cloud Secret Manager (never in this file).
  # Create it first: firebase apphosting:secrets:set PAYSTACK_SECRET_KEY --project bookishdelightghh
  - variable: PAYSTACK_SECRET_KEY
    secret: PAYSTACK_SECRET_KEY
    availability:
      - RUNTIME
